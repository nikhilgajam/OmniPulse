name: OmniPulse

on:
  schedule:
    # ─────────────────────────────────────────────────────────────────────────
    # Cron Syntax Reference (POSIX format):
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23, in UTC)
    # │ │ ┌───────────── day of the month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12)
    # │ │ │ │ ┌───────────── day of the week (0=Sun, 1=Mon, ..., 5=Fri, 6=Sat)
    # │ │ │ │ │
    # * * * * *
    #
    # Timezone Note:
    # GitHub Actions schedules ONLY run in UTC (IST is UTC + 5:30).
    # To convert IST to UTC, subtract 5 hours and 30 minutes:
    #   - 09:15 AM IST  -->  03:45 AM UTC  -->  "45 3 * * *"
    #   - 03:30 PM IST  -->  10:00 AM UTC  -->  "0 10 * * *"
    #
    # Day-of-Week Setting:
    #   - Everyday (Mon-Sun):    use "*"   (e.g., "45 3 * * *")
    #   - Weekdays only (Mon-Fri): use "1-5" (e.g., "45 3 * * 1-5")
    # ─────────────────────────────────────────────────────────────────────────

    # 1) Originally: Morning Run: ~09:15 AM IST (03:42 AM UTC) - Daily
    # Due to CRON job delay adjusting
    - cron: "42 9 * * *"

    # 2) Originally: Afternoon Run: ~03:45 PM IST (10:18 AM UTC) - Daily
    # Due to CRON job delay adjusting
    - cron: "42 2 * * *"

    # Runs every 6 hours: midnight, 6 AM, noon, 6 PM (UTC)
    # - cron: "0 */6 * * *"

    # Weekdays-only alternatives (uncomment if you want Mon-Fri only):
    # - cron: "45 3 * * 1-5"   # 09:15 AM IST (Market Open, Mon-Fri)
    # - cron: "0 10 * * 1-5"   # 03:30 PM IST (Market Close, Mon-Fri)

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

  # Allow instant webhook triggers (e.g. via cron-job.org with zero queue delay)
  repository_dispatch:
    types: [run-omnipulse, omnipulse_trigger]

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OmniPulse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # TELEGRAM_CHAT_IDS: comma-separated subscriber chat IDs (e.g. "111,222,333")
          # Falls back to TELEGRAM_CHAT_ID for single-subscriber backwards compatibility.
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper.py
